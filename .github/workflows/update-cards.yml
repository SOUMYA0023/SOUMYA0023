# ─────────────────────────────────────────────────────────────────────────────
# update-cards.yml
# Regenerates terminal-card.svg and stats-card.svg every 6 hours and on
# manual trigger, committing only when content actually changed.
#
# Cache-busting: after each regeneration the ?v=<run_number> suffix in the
# README image URLs is bumped so GitHub's camo proxy is forced to fetch fresh
# content instead of serving its cached copy.
# ─────────────────────────────────────────────────────────────────────────────

name: Update Profile Cards

on:
  schedule:
    - cron: '0 */6 * * *'   # 00:00, 06:00, 12:00, 18:00 UTC every day
  workflow_dispatch:          # allows manual trigger from Actions tab

permissions:
  contents: write             # needed to push the updated SVG files

jobs:
  update-cards:
    name: Regenerate terminal & stats SVG cards
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # ── API Token ─────────────────────────────────────────────────────────
      # The default GITHUB_TOKEN gives read access to all REST endpoints used
      # by the generator scripts (public user profile, repos, language bytes).
      # This is sufficient for everything currently shown in both cards.
      #
      # ┌─ UPGRADE PATH ───────────────────────────────────────────────────────
      # │ To unlock GraphQL data (pinned repos list, contribution graph):
      # │   1. Create a PAT at https://github.com/settings/tokens
      # │      → select scope: read:user
      # │   2. Add it as a secret: Settings → Secrets → Actions → New secret
      # │      Name:  PROFILE_TOKEN
      # │   3. Swap this single line below:
      # │         GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN }}
      # └──────────────────────────────────────────────────────────────────────
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── 2. Python environment ────────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # ── 3. Generate cards ────────────────────────────────────────────────────
      # Both scripts exit non-zero on any error (network, XML validation, etc.)
      # so the step fails loudly and the workflow never commits a broken SVG.
      - name: Generate terminal card  (ASCII avatar + system info)
        run: python scripts/generate_terminal_card.py

      - name: Generate stats card  (live GitHub statistics)
        run: python scripts/generate_stats_card.py

      # ── 4. Bump cache-buster in README ───────────────────────────────────────
      # GitHub's camo image proxy caches SVGs against their URL.  Because the
      # raw.githubusercontent.com paths never change between runs, the proxy
      # would keep serving stale copies.  We append ?v=<run_number> to both
      # image URLs and update that value on every run so each regeneration
      # produces a distinct URL, forcing a fresh fetch from the proxy.
      - name: Bump ?v= cache-buster in README.md
        run: |
          V="${{ github.run_number }}"
          # Replace ?v=<anything-except-quote> with ?v=<run_number>
          # Works for both the initial ?v=0 and any previously set value.
          sed -i -E "s/(\?v=)[^\"]*/\1${V}/g" README.md
          echo "Cache-buster set to v=${V}"
          grep -o '?v=[^"]*' README.md   # print new values for the run log

      # ── 5. Commit only if there are changes ──────────────────────────────────
      - name: Detect changes  (SVGs + README cache-buster)
        id: diff
        run: |
          if git diff --quiet assets/ README.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No changes detected — skipping commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Changes detected — committing update."
          fi

      - name: Commit and push updated cards + README
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/terminal-card.svg assets/stats-card.svg README.md
          git commit -m "chore: auto-update profile cards [skip ci]"
          git push

